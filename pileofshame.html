<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlog – MarcoHolism</title>

<link rel="stylesheet" href="/style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap');

:root {
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --accent1:#a855f7; --accent2:#3b82f6; --accent3:#ec4899;
  --glass: rgba(27,27,47,0.8);
  --text-muted: #a1a1aa;

  --done-casual: rgba(59,130,246,0.15); /* leichtes Blau */
  --done-full: rgba(168,85,247,0.20);   /* stärkeres Lila */
}

/* Hintergrund */
body {
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background: linear-gradient(to bottom, var(--bg1), var(--bg2), var(--bg3));
  color: white;
  min-height: 100vh;
  padding: 3rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* Partikel-Hintergrund */
#particle-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: -1;
}

/* Titel */
h1 {
  font-size: 3rem;
  font-weight: 800;
  background: linear-gradient(to right, var(--accent1), var(--accent3), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: .5rem;
}

/* ===== BACKLOG SEITE ===== */

.backlog-container {
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding-top: 2rem;
}

.backlog-container .muted {
  color: var(--text-muted);
  font-size: 1.05rem;
  margin-bottom: 2rem;
}

/* Grid */
.game-grid {
  display: grid;
  gap: 1.7rem;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  margin-top: 2rem;
}

/* Game Tile (Glass-Card-Style) */
.game-tile {
  background: var(--glass);
  border-radius: 1rem;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(167,139,250,0.14);
  box-shadow:
    0 4px 18px rgba(0,0,0,0.35),
    0 0 14px rgba(168,85,247,0.12),
    0 0 24px rgba(59,130,246,0.08);
  overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease;
  position: relative;
}

/* Fertig: CASUAL */
.game-tile.done-casual {
  background: var(--done-casual);
  border-color: rgba(59,130,246,0.25);
}

/* Fertig: 100% */
.game-tile.done-full {
  background: var(--done-full);
  border-color: rgba(168,85,247,0.35);
  box-shadow:
    0 0 30px rgba(168,85,247,0.25),
    0 0 20px rgba(236,72,153,0.25);
}

.game-tile:hover {
  transform: translateY(-8px);
  box-shadow:
    0 8px 30px rgba(0,0,0,0.50),
    0 0 26px rgba(168,85,247,0.35),
    0 0 46px rgba(59,130,246,0.25);
}

/* Cover */
.game-cover {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-bottom: 1px solid rgba(147,51,234,0.25);
}

/* Titel */
.game-title {
  padding: 0.9rem;
  font-size: 1.1rem;
  color: #ffffff;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* Badge */
.game-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: linear-gradient(90deg,var(--accent3),var(--accent1));
  padding: 0.3rem 0.65rem;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 700;
  color: #fff;
  box-shadow:
    0 0 10px rgba(236,72,153,0.6),
    0 0 18px rgba(168,85,247,0.5);
}

.game-wrapper {
  position: relative;
}

.year-title {
  font-size: 1.5rem;
  color: #e6e1ff;
  font-weight: 700;
  margin: 2rem 0 1rem;
  text-align: left;
  border-bottom: 1px solid rgba(168,85,247,0.3);
  padding-bottom: 0.3rem;
}

</style>
</head>

<body>

<canvas id="particle-canvas"></canvas>

<h1>Backlog</h1>
<p class="muted">Willkommen auf meinem Pile of Shame 🎮</p>

<div class="backlog-container">
  <div id="gameGrid" class="game-grid"></div>
</div>

<script>
/* -------------------------------------------------------
   1) JSON LADEN UND CARDS GENERIEREN
------------------------------------------------------- */
async function loadBacklog() {
  try {
    const res = await fetch("./backlog.json");
    const data = await res.json();

    // Sortierung nach Release (neu -> alt)
    data.games.sort((a, b) => new Date(b.release) - new Date(a.release));

    const grid = document.getElementById("gameGrid");
    let currentYear = null;

    data.games.forEach(game => {
      const year = new Date(game.release).getFullYear();

      // Neue Jahresüberschrift einfügen, falls Jahr gewechselt
      if (year !== currentYear) {
        currentYear = year;
        const yearDiv = document.createElement("div");
        yearDiv.classList.add("year-title");
        yearDiv.textContent = currentYear;
        grid.appendChild(yearDiv);
      }

      // Tile erzeugen
      const tile = document.createElement("div");
      tile.classList.add("game-tile");

      // Fertig? -> Highlight-Klassen
      if (game.status === "done") {
        if (game.completion === "casual") tile.classList.add("done-casual");
        if (game.completion === "100%") tile.classList.add("done-full");
      }

      // HTML der Card
      tile.innerHTML = `
        <div class="game-wrapper">
          <img class="game-cover" src="${game.cover}" alt="${game.title}">
          ${game.status === "wip" ? `<span class="game-badge">WIP</span>` : ""}
        </div>
        <div class="game-title">${game.title}</div>
      `;

      grid.appendChild(tile);
    });

  } catch (err) {
    console.error("Fehler beim Laden der JSON:", err);
  }
}

loadBacklog();


/* -------------------------------------------------------
   2) PARTIKEL-HINTERGRUND
------------------------------------------------------- */
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
const particleCount = window.innerWidth < 768 ? 10 : 30;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 3 + 1;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = Math.random() * 1 + 0.5;

    const baseColors = [
      [168,85,247],
      [59,130,246],
      [236,72,153]
    ];
    const c = baseColors[Math.floor(Math.random() * baseColors.length)];
    const alpha = Math.random() * 0.6 + 0.4;
    this.color = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
  }
  update() {
    this.x += this.speedX;
    this.y -= this.speedY;
    if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
      this.reset();
      this.y = canvas.height;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

for(let i = 0; i < particleCount; i++) particles.push(new Particle());

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
