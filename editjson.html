<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Livingdex Editor</title>
<style>
/* Grundlayout */
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #1a1a1a;
  color: #e0e0e0;
  margin: 20px;
}

/* Überschrift */
h1 {
  text-align: center;
  font-weight: 400;
  margin-bottom: 30px;
  color: #f5f5f5;
}

/* Container */
#livingdex-container {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* Tabellen */
table {
  border-collapse: collapse;
  width: 100%;
  backdrop-filter: blur(10px);
  background: rgba(30, 30, 30, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Tabellenüberschrift */
caption {
  caption-side: top;
  text-align: left;
  font-size: 1.2em;
  font-weight: 500;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* Tabellenkopf */
th {
  background: rgba(255,255,255,0.05);
  color: #f0f0f0;
  padding: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  text-align: center;
}

/* Tabellenzellen */
td {
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 4px;
}

/* Inputs & Selects */
input, select {
  width: 100%;
  box-sizing: border-box;
  background: rgba(255,255,255,0.05);
  color: #f0f0f0;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 6px 8px;
  font-size: 0.9em;
  font-family: inherit;
  outline: none;
  appearance: none; /* removes native styling */
  -webkit-appearance: none;
  -moz-appearance: none;
}

/* Optional: Fokus-Effekt */
input:focus, select:focus {
  border-color: #4a90e2;
  background: rgba(255,255,255,0.1);
}

/* Custom Pfeil für select */
select {
  background-image: linear-gradient(45deg, transparent 50%, #f0f0f0 50%), 
                    linear-gradient(135deg, #f0f0f0 50%, transparent 50%);
  background-position: calc(100% - 15px) calc(50% - 2px), calc(100% - 10px) calc(50% - 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 25px;
}

/* Zeilen hover Effekt */
tr:hover td {
  background: rgba(255,255,255,0.05);
}

/* Scrollbar (optional modern dark style) */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
}
::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
}
</style>
</head>
<body>

<h1>Livingdex Editor</h1>
<button id="download-btn">Download JSON</button>
<div id="livingdex-container"></div>

<script>
// Dropdown Definitionen
const dropdowns = {
  gender: ['-', 'male', 'female'],
  ball: ['pokeball', 'super', 'hyperball', 'meisterball', 'wiederball', 'flottball', 'raetselball'],
  nature: ['Robust', 'Solo', 'Mutig', 'Hart', 'Frech', 'Kühn', 'Sanft', 'Locker', 'Pfiffig', 'Lasch', 'Scheu', 'Hastig', 'Ernst', 'Froh', 'Naiv', 'Mäßig', 'Mild', 'Ruhig', 'Zaghaft', 'Hitzig', 'Still', 'Zart', 'Forsch', 'Sacht', 'Kauzig']
};

// Lade die livingdex.json Datei
fetch('livingdex.json')
  .then(response => response.json())
  .then(livingdex => {
    buildTable(livingdex);
    document.getElementById('download-btn').addEventListener('click', () => downloadJSON(livingdex));
  })
  .catch(error => console.error('Fehler beim Laden der JSON:', error));

function buildTable(livingdex) {
  const container = document.getElementById('livingdex-container');
  container.innerHTML = '';

  livingdex.forEach(box => {
    const table = document.createElement('table');

    const caption = document.createElement('caption');
    caption.innerText = box.title;
    table.appendChild(caption);

    const header = document.createElement('tr');
    ['Name', 'Img', 'Gender', 'Game', 'Trainer', 'ID', 'Ball', 'Level', 'Nature', 'Ability'].forEach(h => {
      const th = document.createElement('th');
      th.innerText = h;
      header.appendChild(th);
    });
    table.appendChild(header);

    // max 30 Slots pro Box
    for (let i = 0; i < 30; i++) {
      const poke = box.pokemon[i] || {};
      const row = document.createElement('tr');
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach(key => {
        const td = document.createElement('td');
        let el;
        if (dropdowns[key]) {
          // Dropdown erstellen
          el = document.createElement('select');
          dropdowns[key].forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.innerText = opt;
            if (poke[key] === opt) option.selected = true;
            el.appendChild(option);
          });
        } else {
          // Standard Input
          el = document.createElement('input');
          el.value = poke[key] || '';
        }
        td.appendChild(el);
        row.appendChild(td);
      });
      table.appendChild(row);
    }
    container.appendChild(table);
  });
}

function downloadJSON(livingdex) {
  const tables = document.querySelectorAll('table');
  const updated = [];

  tables.forEach((table, boxIndex) => {
    const box = { title: table.caption.innerText, pokemon: [] };
    const rows = table.querySelectorAll('tr');
    rows.forEach((row, rowIndex) => {
      if (rowIndex === 0) return; // Header überspringen
      const cells = row.querySelectorAll('td');
      const poke = {};
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach((key, i) => {
        const el = cells[i].querySelector('input, select');
        poke[key] = el.value || '';
      });
      box.pokemon.push(poke.name ? poke : null);
    });
    updated.push(box);
  });

  const blob = new Blob([JSON.stringify(updated, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'livingdex.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
