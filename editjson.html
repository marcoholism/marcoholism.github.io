<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Livingdex Editor</title>
<style>
/* Grundlayout */
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #1a1a1a;
  color: #e0e0e0;
  margin: 20px;
}

/* Überschrift */
h1 {
  text-align: center;
  font-weight: 400;
  margin-bottom: 30px;
  color: #f5f5f5;
}

/* Container */
#livingdex-container {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* Tabellen */
table {
  border-collapse: collapse;
  width: 100%;
  backdrop-filter: blur(10px);
  background: rgba(30, 30, 30, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Tabellenüberschrift */
caption {
  caption-side: top;
  text-align: left;
  font-size: 1.2em;
  font-weight: 500;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Move Buttons */
.caption-controls button {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #e0e0e0;
  margin-left: 4px;
  padding: 2px 6px;
  cursor: pointer;
}
.caption-controls button:hover {
  background: rgba(255,255,255,0.2);
}

/* Tabellenkopf */
th {
  background: rgba(255,255,255,0.05);
  color: #f0f0f0;
  padding: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  text-align: center;
}

/* Tabellenzellen */
td {
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 4px;
}

/* Inputs & Selects */
input, select {
  width: 100%;
  box-sizing: border-box;
  background: rgba(255,255,255,0.05);
  color: #f0f0f0;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 6px 8px;
  font-size: 0.9em;
  font-family: inherit;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}

/* Fokus-Effekt */
input:focus, select:focus {
  border-color: #4a90e2;
  background: rgba(255,255,255,0.1);
}

/* Custom Pfeil für select */
select {
  background-image: linear-gradient(45deg, transparent 50%, #f0f0f0 50%), 
                    linear-gradient(135deg, #f0f0f0 50%, transparent 50%);
  background-position: calc(100% - 15px) calc(50% - 2px), calc(100% - 10px) calc(50% - 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 25px;
}

/* Zeilen hover Effekt */
tr:hover td {
  background: rgba(255,255,255,0.05);
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
}
::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
}
</style>
</head>
<body>

<h1>Livingdex Editor</h1>
<div style="margin-bottom:20px; text-align:center;">
  <button id="add-box-btn">+ Neue Box</button>
  <button id="download-btn">Download JSON</button>
</div>
<div id="livingdex-container"></div>

<script>
// Dropdown Definitionen inkl. Pokemon-Liste für Autocomplete
const dropdowns = {
  gender: ['genderless', 'male', 'female'],
  ball: ['pokeball', 'super', 'hyperball', 'meisterball', 'wiederball', 'flottball', 'raetselball'],
  nature: ['Robust', 'Solo', 'Mutig', 'Hart', 'Frech', 'Kühn', 'Sanft', 'Locker', 'Pfiffig', 'Lasch', 'Scheu', 'Hastig', 'Ernst', 'Froh', 'Naiv', 'Mäßig', 'Mild', 'Ruhig', 'Zaghaft', 'Hitzig', 'Still', 'Zart', 'Forsch', 'Sacht', 'Kauzig'],
  game: ['GameBoy', 'Kalos', 'Alola', 'LetsGo', 'Galar', 'Sinnoh', 'Hisui', 'Paldea', 'GO'],
  pokemon: ['Pikachu','Mew','Charizard','Bulbasaur','Squirtle','Eevee'] // Beispiel – kann erweitert werden
};

let livingdexData = [];

// Lade die livingdex.json Datei
fetch('livingdex.json')
  .then(response => response.json())
  .then(livingdex => {
    livingdexData = livingdex;
    buildPokemonDatalist(); // datalist erzeugen
    buildTable(livingdexData);
  })
  .catch(error => console.error('Fehler beim Laden der JSON:', error));

document.getElementById('download-btn').addEventListener('click', () => downloadJSON());
document.getElementById('add-box-btn').addEventListener('click', () => addBox());

// Datalist für Pokemon-Namen erzeugen
function buildPokemonDatalist() {
  const existing = document.getElementById('pokemon-list');
  if (existing) existing.remove();
  const datalist = document.createElement('datalist');
  datalist.id = 'pokemon-list';
  dropdowns.pokemon.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    datalist.appendChild(opt);
  });
  document.body.appendChild(datalist);
}

function buildTable(livingdex) {
  const container = document.getElementById('livingdex-container');
  container.innerHTML = '';

  livingdex.forEach((box, boxIndex) => {
    const table = document.createElement('table');

    const caption = document.createElement('caption');

    // Titel editierbar
    const title = document.createElement('span');
    title.contentEditable = true;
    title.innerText = box.title;

    // Steuerung für Verschieben
    const controls = document.createElement('span');
    controls.className = 'caption-controls';

    const upBtn = document.createElement('button');
    upBtn.innerText = '↑';
    upBtn.addEventListener('click', () => moveBox(boxIndex, -1));

    const downBtn = document.createElement('button');
    downBtn.innerText = '↓';
    downBtn.addEventListener('click', () => moveBox(boxIndex, 1));

    controls.appendChild(upBtn);
    controls.appendChild(downBtn);

    caption.appendChild(title);
    caption.appendChild(controls);

    table.appendChild(caption);

    const header = document.createElement('tr');
    ['Name', 'Img', 'Gender', 'Game', 'Trainer', 'ID', 'Ball', 'Level', 'Nature', 'Ability'].forEach(h => {
      const th = document.createElement('th');
      th.innerText = h;
      header.appendChild(th);
    });
    table.appendChild(header);

    // max 30 Slots pro Box
    for (let i = 0; i < 30; i++) {
      const poke = box.pokemon[i] || {};
      const row = document.createElement('tr');
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach(key => {
        const td = document.createElement('td');
        let el;
        if (dropdowns[key]) {
          el = document.createElement('select');
          dropdowns[key].forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.innerText = opt;
            if (poke[key] === opt) option.selected = true;
            el.appendChild(option);
          });
        } else if (key === 'name') {
          el = document.createElement('input');
          el.value = poke[key] || '';
          el.setAttribute('list', 'pokemon-list'); // autocomplete aktivieren
        } else if (key === 'level') {
          el = document.createElement('input');
          el.type = 'number';
          el.min = 1;
          el.max = 100;
          el.value = poke[key] || '';
        } else {
          el = document.createElement('input');
          el.value = poke[key] || '';
        }
        td.appendChild(el);
        row.appendChild(td);
      });
      table.appendChild(row);
    }
    container.appendChild(table);
  });
}

function addBox() {
  const newBox = {
    title: "Neue Box",
    pokemon: Array(30).fill(null)
  };
  livingdexData.push(newBox);
  buildTable(livingdexData);
}

function moveBox(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= livingdexData.length) return;
  const [moved] = livingdexData.splice(index, 1);
  livingdexData.splice(newIndex, 0, moved);
  buildTable(livingdexData);
}

function downloadJSON() {
  const tables = document.querySelectorAll('table');
  const updated = [];

  tables.forEach(table => {
    const box = { title: table.caption.querySelector('span').innerText, pokemon: [] };
    const rows = table.querySelectorAll('tr');
    rows.forEach((row, rowIndex) => {
      if (rowIndex === 0) return;
      const cells = row.querySelectorAll('td');
      const poke = {};
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach((key, i) => {
        const el = cells[i].querySelector('input, select');
        poke[key] = el.value || '';
      });
      box.pokemon.push(poke.name ? poke : null);
    });
    updated.push(box);
  });

  const blob = new Blob([JSON.stringify(updated, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'livingdex.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
