<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Livingdex Editor</title>
<style>
  /* Grundfarben und Schrift */
  :root {
    --bg-color: #121212;
    --table-bg: #1e1e1e;
    --header-bg: #2c2c2c;
    --text-color: #e0e0e0;
    --border-color: #333;
    --accent-color: #ffcc00;
    --input-bg: #2c2c2c;
    --input-text: #e0e0e0;
    --input-border: #555;
    --caption-color: #ffcc00;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
    color: var(--accent-color);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 40px;
    background-color: var(--table-bg);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  caption {
    font-size: 1.5em;
    padding: 10px;
    background-color: var(--header-bg);
    color: var(--caption-color);
    font-weight: bold;
  }

  th, td {
    padding: 10px;
    text-align: center;
    border: 1px solid var(--border-color);
  }

  th {
    background-color: var(--header-bg);
    color: var(--text-color);
  }

  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid var(--input-border);
    background-color: var(--input-bg);
    color: var(--input-text);
    font-size: 0.9em;
  }

  input:focus, select:focus {
    outline: 2px solid var(--accent-color);
  }

  button {
    padding: 10px 20px;
    background-color: var(--accent-color);
    border: none;
    border-radius: 5px;
    color: #121212;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background-color 0.2s;
  }

  button:hover {
    background-color: #e6b800;
  }
</style>
</head>
<body>

<h1>Livingdex Editor</h1>
<button id="download-btn">Download JSON</button>
<div id="livingdex-container"></div>

<script>
// Dropdown Definitionen
const dropdowns = {
  gender: ['-', 'male', 'female'],
  ball: ['pokeball', 'super', 'hyperball', 'meisterball', 'wiederball', 'flottball', 'raetselball'],
  nature: ['Robust', 'Solo', 'Mutig', 'Hart', 'Frech', 'Kühn', 'Sanft', 'Locker', 'Pfiffig', 'Lasch', 'Scheu', 'Hastig', 'Ernst', 'Froh', 'Naiv', 'Mäßig', 'Mild', 'Ruhig', 'Zaghaft', 'Hitzig', 'Still', 'Zart', 'Forsch', 'Sacht', 'Kauzig']
};

// Lade die livingdex.json Datei
fetch('livingdex.json')
  .then(response => response.json())
  .then(livingdex => {
    buildTable(livingdex);
    document.getElementById('download-btn').addEventListener('click', () => downloadJSON(livingdex));
  })
  .catch(error => console.error('Fehler beim Laden der JSON:', error));

function buildTable(livingdex) {
  const container = document.getElementById('livingdex-container');
  container.innerHTML = '';

  livingdex.forEach(box => {
    const table = document.createElement('table');

    const caption = document.createElement('caption');
    caption.innerText = box.title;
    table.appendChild(caption);

    const header = document.createElement('tr');
    ['Name', 'Img', 'Gender', 'Game', 'Trainer', 'ID', 'Ball', 'Level', 'Nature', 'Ability'].forEach(h => {
      const th = document.createElement('th');
      th.innerText = h;
      header.appendChild(th);
    });
    table.appendChild(header);

    // max 30 Slots pro Box
    for (let i = 0; i < 30; i++) {
      const poke = box.pokemon[i] || {};
      const row = document.createElement('tr');
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach(key => {
        const td = document.createElement('td');
        let el;
        if (dropdowns[key]) {
          // Dropdown erstellen
          el = document.createElement('select');
          dropdowns[key].forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.innerText = opt;
            if (poke[key] === opt) option.selected = true;
            el.appendChild(option);
          });
        } else {
          // Standard Input
          el = document.createElement('input');
          el.value = poke[key] || '';
        }
        td.appendChild(el);
        row.appendChild(td);
      });
      table.appendChild(row);
    }
    container.appendChild(table);
  });
}

function downloadJSON(livingdex) {
  const tables = document.querySelectorAll('table');
  const updated = [];

  tables.forEach((table, boxIndex) => {
    const box = { title: table.caption.innerText, pokemon: [] };
    const rows = table.querySelectorAll('tr');
    rows.forEach((row, rowIndex) => {
      if (rowIndex === 0) return; // Header überspringen
      const cells = row.querySelectorAll('td');
      const poke = {};
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach((key, i) => {
        const el = cells[i].querySelector('input, select');
        poke[key] = el.value || '';
      });
      box.pokemon.push(poke.name ? poke : null);
    });
    updated.push(box);
  });

  const blob = new Blob([JSON.stringify(updated, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'livingdex.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
