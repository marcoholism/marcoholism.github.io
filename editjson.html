<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Livingdex Editor</title>
<style>
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 5px; text-align: center; }
  input, select { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>

<h1>Livingdex Editor</h1>
<div id="livingdex-container"></div>
<button id="download-json">JSON herunterladen</button>

<script>
// Lade die livingdex.json Datei
let livingdexData = [];
fetch('livingdex.json')
  .then(response => response.json())
  .then(livingdex => {
    livingdexData = livingdex;
    buildTable(livingdexData);
  })
  .catch(error => console.error('Fehler beim Laden der JSON:', error));

function buildTable(livingdex) {
  const container = document.getElementById('livingdex-container');
  container.innerHTML = '';

  livingdex.forEach((box, boxIndex) => {
    const table = document.createElement('table');

    const caption = document.createElement('caption');
    caption.innerText = box.title;
    table.appendChild(caption);

    const header = document.createElement('tr');
    ['Name', 'Img', 'Gender', 'Game', 'Trainer', 'ID', 'Ball', 'Level', 'Nature', 'Ability'].forEach(h => {
      const th = document.createElement('th');
      th.innerText = h;
      header.appendChild(th);
    });
    table.appendChild(header);

    // max 30 Slots pro Box
    for (let i = 0; i < 30; i++) {
      const pokemon = box.pokemon[i] || {}; // null → leeres Objekt
      const row = document.createElement('tr');

      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach(key => {
        const td = document.createElement('td');
        let input;

        if (key === 'gender') {
          // Dropdown für Gender
          input = document.createElement('select');
          const options = [
            {text:'-', value:'genderless'},
            {text:'male', value:'male'},
            {text:'female', value:'female'}
          ];
          options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.innerText = opt.text;
            if (pokemon[key] === opt.value) option.selected = true;
            input.appendChild(option);
          });
        } else {
          input = document.createElement('input');
          input.value = pokemon[key] || '';
        }

        td.appendChild(input);
        row.appendChild(td);
      });
      table.appendChild(row);
    }

    container.appendChild(table);
  });
}

// Download-Funktion
document.getElementById('download-json').addEventListener('click', () => {
  // Aktuelle Tabellenwerte in livingdexData zurückschreiben
  const tables = document.querySelectorAll('#livingdex-container table');
  tables.forEach((table, boxIndex) => {
    const rows = table.querySelectorAll('tr');
    const boxData = [];
    for (let i = 1; i < rows.length; i++) { // Header überspringen
      const cells = rows[i].querySelectorAll('td');
      const poke = {};
      ['name','img','gender','game','trainer','id','ball','level','nature','ability'].forEach((key, idx) => {
        const el = cells[idx].querySelector('input, select');
        poke[key] = el.value || null;
      });
      // Wenn Name leer → ganze Zeile als null speichern
      if (!poke.name) {
        boxData.push(null);
      } else {
        boxData.push(poke);
      }
    }
    livingdexData[boxIndex].pokemon = boxData;
  });

  const blob = new Blob([JSON.stringify(livingdexData, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'livingdex.json';
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
