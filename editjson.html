<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Livingdex Editor</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Livingdex JSON Editor</h1>
  <table id="pokemonTable">
    <thead>
      <tr>
        <th>Box</th>
        <th>Name</th>
        <th>Bild</th>
        <th>Geschlecht</th>
        <th>Spiel</th>
        <th>Trainer</th>
        <th>ID</th>
        <th>Ball</th>
        <th>Level</th>
        <th>Wesen</th>
        <th>Fähigkeit</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button onclick="exportJSON()">JSON herunterladen</button>

  <script>
    let livingdex = [];

    const tableBody = document.querySelector("#pokemonTable tbody");

    async function loadJSON() {
      try {
        const response = await fetch('livingdex.json');
        livingdex = await response.json();
        buildTable();
      } catch (error) {
        console.error("Fehler beim Laden der JSON:", error);
        alert("Konnte livingdex.json nicht laden. Prüfe den Pfad!");
      }
    }

    function buildTable() {
      tableBody.innerHTML = "";
      livingdex.forEach((box, boxIndex) => {
        box.pokemon.forEach((poke, pokeIndex) => {
          const row = document.createElement("tr");

          // Box-Name als erstes Feld
          const boxCell = document.createElement("td");
          boxCell.textContent = box.title;
          row.appendChild(boxCell);

          // Felder des Pokémon
          const keys = ["name","img","gender","game","trainer","id","ball","level","nature","ability"];
          keys.forEach(key => {
            const cell = document.createElement("td");
            const input = document.createElement("input");
            input.value = poke[key] !== undefined ? poke[key] : "";
            input.onchange = (e) => livingdex[boxIndex].pokemon[pokeIndex][key] = e.target.value;
            cell.appendChild(input);
            row.appendChild(cell);
          });

          tableBody.appendChild(row);
        });
      });
    }

    function exportJSON() {
      const jsonStr = JSON.stringify(livingdex, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "livingdex_edited.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    loadJSON();
  </script>
</body>
</html>
