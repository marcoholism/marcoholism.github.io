<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Dex – MarcoHolism</title>
<style>
body { font-family: sans-serif; background:#0f0c29; color:white; padding:2rem; display:flex; flex-direction:column; align-items:center;}
.container { max-width:1000px; width:100%; display:grid; gap:2rem;}
.box { background: rgba(27,27,47,0.8); padding:1rem; border-radius:12px; }
.box h2 { margin-bottom:1rem; }
.grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.slot { background: rgba(255,255,255,0.05); border-radius:8px; padding:4px; font-size:0.65rem; text-align:center; min-height:100px;}
.slot img { max-width:50px; margin-bottom:2px;}
.gender { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; font-size:0.65rem; color:#fff;}
.gender.male { background:#3b82f6; }
.gender.female { background:#ef4444; }
.gender.genderless { background:#6b7280; }
</style>
</head>
<body>
<h1>Living Dex Tracker</h1>
<div class="container"></div>

<script>
async function loadDex() {
  try {
    const response = await fetch('livingdex.json');
    if(!response.ok) throw new Error('Fehler beim Laden der JSON');
    const boxes = await response.json();

    const container = document.querySelector('.container');
    container.innerHTML = '';

    boxes.forEach(boxData => {
      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = `<h2>${boxData.title}</h2>`;

      const grid = document.createElement('div');
      grid.className = 'grid';

      for (let i = 0; i < 30; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        const p = boxData.pokemon[i];
        if(p){
          slot.innerHTML = `
            <img src="${p.img}" alt="${p.name}">
            <div class="name">${p.name}</div>
            <div class="icons">
              <span class="gender ${p.gender}">${p.gender==='male'?'♂':p.gender==='female'?'♀':'–'}</span>
              <span title="Spiel">${p.game}</span>
            </div>
            <div class="trainer">OT: ${p.trainer}<br>ID: ${p.id}</div>
          `;
        } else {
          slot.innerHTML = `<div class="name">–</div>`;
        }
        grid.appendChild(slot);
      }

      box.appendChild(grid);
      container.appendChild(box);
    });
  } catch(e) {
    console.error(e);
    alert('Fehler beim Laden der JSON. Prüfe Pfad & Struktur.');
  }
}
loadDex();
</script>
</body>
</html>
