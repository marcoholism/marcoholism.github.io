<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elden Ring – Optimaler Questpfad</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0e0e0e;
  --bg-panel: #161616;
  --gold: #c9a24d;
  --gold-soft: #9f8440;
  --danger: #b84c4c;
  --text-main: #e6e6e6;
  --text-muted: #a8a8a8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Crimson Pro', serif;
  background: radial-gradient(circle at top, #1b1b1b, var(--bg-dark));
  color: var(--text-main);
  line-height: 1.6;
}

header, footer { text-align: center; padding: 2.5rem 1rem; }
header { border-bottom: 1px solid rgba(201,162,77,0.2); }
footer { border-top: 1px solid rgba(201,162,77,0.15); color: var(--text-muted); font-size: 0.9rem; }

header h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  letter-spacing: 0.08em;
  color: var(--gold);
  margin-bottom: 0.6rem;
}

main { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem; }

/* Timeline */
.timeline {
  position: relative;
  margin-left: 2rem;
  padding-left: 2rem;
  border-left: 2px solid rgba(201,162,77,0.35);
  display: grid;
  gap: 2.2rem;
}

.timeline-card {
  position: relative;
  background: linear-gradient(180deg, #1a1a1a, var(--bg-panel));
  border: 1px solid rgba(201,162,77,0.15);
  border-radius: 10px;
  padding: 1.5rem 1.7rem;
}

/* Bulletpoints auf der Linie */
.timeline-card::before {
  content: "";
  position: absolute;
  left: -2.6rem;
  top: 1.3rem;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 4px rgba(201,162,77,0.15);
}

.timeline-card h2 {
  font-family: 'Cinzel', serif;
  font-size: 1.4rem;
  color: var(--gold);
  margin-bottom: 0.3rem;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}

.event-id {
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  color: var(--gold-soft);
  border: 1px solid rgba(201,162,77,0.35);
  padding: 0.1rem 0.45rem;
  border-radius: 6px;
  background: rgba(201,162,77,0.08);
}

.meta { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0.6rem; }

.ponr {
  margin-top: 1rem;
  padding: 0.7rem 1rem;
  border-left: 4px solid var(--danger);
  background: rgba(184,76,76,0.1);
  color: #e2bcbc;
  font-size: 0.95rem;
}

.ponr strong { color: #f0d0d0; }

.tags { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag {
  border: 1px solid rgba(201,162,77,0.35);
  color: var(--gold-soft);
  padding: 0.2rem 0.6rem;
  font-size: 0.8rem;
  border-radius: 999px;
  background: rgba(201,162,77,0.05);
}

.rewards, .requires {
  margin-top: 0.8rem;
  padding: 0.5rem 0.8rem;
  background: rgba(201,162,77,0.05);
  border-radius: 6px;
  font-size: 0.9rem;
  color: var(--gold-soft);
}
</style>
</head>
<body>

<header>
  <h1>Optimaler Questpfad</h1>
  <p>Eine empfohlene Reihenfolge aller wichtigen Quests in <em>Elden Ring</em>, einfach abhaken.</p>
</header>

<main>
  <section class="timeline" id="timeline-container"></section>
</main>

<footer>
  <p>Fan-Projekt · Elden Ring © FromSoftware / Bandai Namco</p>
</footer>

<script>
const timelineContainer = document.getElementById('timeline-container');
const QUEST_FILE_PATH = 'all_quests.quest';

async function loadQuestFile(file) {
  const text = await fetch(file).then(r => r.text());

  // Regex: ID + Block
  const regex = /^([EO]\d+_\w+)\s*([\s\S]+?)(?=^[EO]\d+_\w+|\Z)/gm;
  const events = [];
  let match;
  while ((match = regex.exec(text)) !== null) {
    const id = match[1];
    const block = match[2];

    const questMatch = block.match(/QUEST: (.+)/);
    const titleMatch = block.match(/TITLE: (.+)/);
    const textMatch = block.match(/TEXT: ([\s\S]+?)(\nPONR:|\nTAGS:|\nREWARDS:|$)/);
    const ponrMatch = block.match(/PONR: ([^\n]+)/);
    const tagsMatch = block.match(/TAGS: ([^\n]+)/);
    const rewardsMatch = block.match(/REWARDS: ([^\n]+)/);

    events.push({
      eventID: id,
      eventDisplayID: id.split('_')[0],
      quest: questMatch ? questMatch[1] : '',
      title: titleMatch ? titleMatch[1] : '',
      text: textMatch ? textMatch[1].trim() : '',
      ponr: ponrMatch ? ponrMatch[1] : '',
      tags: tagsMatch ? tagsMatch[1].split(',').map(t=>t.trim()) : [],
      rewards: rewardsMatch ? rewardsMatch[1] : ''
    });
  }

  return events;
}

async function renderTimeline() {
  const events = await loadQuestFile(QUEST_FILE_PATH);

  events.forEach(event => {
    const card = document.createElement('div');
    card.className = 'timeline-card';

    const storageKey = 'done_' + event.eventID;
    const done = localStorage.getItem(storageKey);
    if(done) card.style.opacity = '0.45';

    card.innerHTML = `
      <h2>${event.quest} <span class="event-id">${event.eventDisplayID}</span></h2>
      <p><strong>${event.title}</strong>: ${event.text}</p>
      ${event.ponr ? `<div class="ponr"><strong>PoNR:</strong> ${event.ponr}</div>` : ''}
      ${event.rewards ? `<div class="rewards"><strong>Belohnung:</strong> ${event.rewards}</div>` : ''}
      ${event.tags.length ? '<div class="tags">' + event.tags.map(t=>'<span class="tag">'+t+'</span>').join('') + '</div>' : ''}
    `;

    const btn = document.createElement('button');
    btn.textContent = done ? '↺ Rückgängig' : '✓ Erledigt';
    btn.style.marginTop = '1rem';
    btn.style.background = 'transparent';
    btn.style.border = '1px solid rgba(201,162,77,0.4)';
    btn.style.color = 'var(--gold-soft)';
    btn.style.padding = '0.3rem 0.8rem';
    btn.style.borderRadius = '6px';
    btn.style.cursor = 'pointer';

    btn.addEventListener('click', () => {
      const current = localStorage.getItem(storageKey);
      localStorage.setItem(storageKey, current ? '' : 'true');
      card.style.opacity = current ? '1' : '0.45';
      btn.textContent = current ? '✓ Erledigt' : '↺ Rückgängig';
    });

    timelineContainer.appendChild(card);
    card.appendChild(btn);
  });
}

renderTimeline();
</script>

</body>
</html>
